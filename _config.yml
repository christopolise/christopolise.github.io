# Site settings. Restart `bundle exec jekyll serve` after editing this file.

title: Christopher Kitras
email: chkitras@gmail.com
github_username: christopolise
linkedin_url: https://www.linkedin.com/in/christopher-kitras/
google_scholar: https://scholar.google.com/citations?view_op=list_works&hl=en&hl=en&user=X8pWNkYAAAAJ
resume: /assets/Christopher_Kitras_Resume.pdf
cv: /assets/Christopher_Kitras_CV.pdf
role: PhD Candidate, Electrical and Computer Engineering, Brigham Young University
description: >-
  Christopher Kitras is a PhD candidate in Electrical and Computer Engineering at
  BYU's NET Lab, building resilient sensor networks and IoT systems that get more
  out of the hardware that is already there.
google_analytics: G-ZK92G56466
baseurl: ""
url: "https://kitras.dev"

# Home page: set to false to hide the CV-derived sections (education,
# experience, skills, teaching) and keep the home page lean.
home_show_cv: true

collections:
  publications:
    output: true
    permalink: /research/:name/
  posters:
    output: true
    permalink: /research/:name/
  proj:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { type: publications }
    values: { layout: work, section: research, kind: Paper }
  - scope: { type: posters }
    values: { layout: work, section: research, kind: Poster }
  - scope: { type: proj }
    values: { layout: work, section: projects, kind: Project }

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - PRODUCT.md
  - DESIGN.md
  - .impeccable/
  - .github/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - _misc/
