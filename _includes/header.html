<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="site-name" href="{{ '/' | relative_url }}" aria-label="Christopher Kitras, home"><span class="full">Christopher Kitras</span><span class="mono" aria-hidden="true">CK</span></a>
    <nav class="site-nav" aria-label="Main">
      {%- assign sec = page.section | default: page.nav -%}
      <a href="{{ '/research/' | relative_url }}"{% if sec == 'research' %} aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/projects/' | relative_url }}"{% if sec == 'projects' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/cv/' | relative_url }}"{% if sec == 'cv' %} aria-current="page"{% endif %}>CV</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn theme-toggle" type="button" data-mode="system" aria-label="Theme: match system. Switch to light.">
        <span data-icon="system">{% include icon.html name="monitor" %}</span>
        <span data-icon="light">{% include icon.html name="sun" %}</span>
        <span data-icon="dark">{% include icon.html name="moon" %}</span>
      </button>
      <a class="btn btn-sm btn-primary email-btn" href="mailto:{{ site.email }}" aria-label="Email {{ site.email }}">{% include icon.html name="mail" %}<span class="label">Email</span></a>
    </div>
  </div>
</header>
