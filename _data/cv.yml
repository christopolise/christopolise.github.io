# One sentence for the home page; the full statement below is used on the CV page.
tagline: >-
  I make network-enabled embedded systems more resilient, mostly by getting
  more out of hardware and infrastructure that is already deployed.

statement: >-
  I study the resilience of network-enabled embedded systems. I design sensor
  networks that adapt to their environment, and I repurpose technology that is
  already deployed, from commodity hardware to existing network infrastructure,
  so it can do more than it was built for without adding hardware.

